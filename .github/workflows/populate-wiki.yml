## TensorRT (opcional)

Para acelerar la inferencia en Jetson:

```python
from ultralytics import YOLO
model = YOLO("weights/best.pt")
model.export(format="engine", imgsz=640)
```

El `.engine` debe generarse en la misma Jetson o en un entorno compatible.

