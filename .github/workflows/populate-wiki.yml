name: Populate Wiki

on:
  workflow_dispatch:
  push:
    branches:
      - copilot/rellenar-wiki-con-informacion

permissions:
  contents: write

jobs:
  populate-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Enable wiki via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH /repos/${{ github.repository }} \
            -f has_wiki=true || true

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone or init wiki repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki || {
            echo "Wiki not initialized, initializing..."
            mkdir wiki
            cd wiki
            git init -b master
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git"
          }

      - name: Copy wiki pages
        run: |
          cp .github/wiki/*.md wiki/

      - name: Push wiki pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd wiki
          git add -A
          git commit -m "docs: populate wiki with full project documentation" || echo "Nothing to commit"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git" HEAD:master \
            || git push --set-upstream "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git" master
