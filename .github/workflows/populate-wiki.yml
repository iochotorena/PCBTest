name: Populate Wiki

on:
  workflow_dispatch:
  push:
    branches:
      - copilot/rellenar-wiki-con-informacion

permissions:
  contents: write

jobs:
  populate-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Enable wiki via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH /repos/${{ github.repository }} \
            -f has_wiki=true || true

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone wiki repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Initialize the wiki by creating the first page via API if needed
          # Try to clone; if it fails, initialize it
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki || {
            echo "Wiki not initialized, creating initial page via API..."
            gh api --method POST /repos/${{ github.repository }}/pages \
              -f source='{"branch":"master"}' || true
            # Try to init the wiki git repo manually
            mkdir wiki
            cd wiki
            git init
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git"
          }

      - name: Create Home page
        run: |
          cat > wiki/Home.md << 'WIKIEOF'
# PCBTest — Wiki

Bienvenido a la wiki del repositorio **PCBTest**.

---

## Contenido de la wiki

| Página | Descripción |
|--------|-------------|
| [PCBTest – Aplicación de inspección](PCBTest) | Guía completa de la aplicación de inspección de placas PCB. |
| [Instalación en Jetson Orin Nano](Instalacion) | Instrucciones de instalación en Jetson Orin Nano con Docker. |
| [Guía de uso](Guia-de-Uso) | Cómo usar la GUI, la cámara y hacer inspecciones. |
| [2dDatasetCreator](2dDatasetCreator) | Generador sintético de datasets YOLO en 2D. |
| [SubsetMaker](SubsetMaker) | Herramienta GUI para gestión de datasets YOLO. |
